name: sekkati-pois

# Builds sekkati/eg-pois.json (Egypt's speed cameras, bumps, tolls, checkpoints) from the Geofabrik OSM extract,
# so the app knows them offline without the driver reporting anything. Runs when the script changes or by hand.
on:
  push:
    paths:
      - "tools/sekkati_pois.py"
      - ".github/workflows/sekkati-pois.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pois:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Download the Egypt extract (IPv4 + retries; urllib hit "network unreachable" once)
        run: curl -4 -fL --retry 5 --retry-delay 10 --retry-all-errors -o egypt.osm.pbf https://download.geofabrik.de/africa/egypt-latest.osm.pbf
      - name: Build from the Geofabrik Egypt extract
        run: python3 tools/sekkati_pois.py
      - name: Commit
        run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add sekkati/eg-pois.json
          git diff --cached --quiet && exit 0
          git commit -m "sekkati: refresh Egypt radars/tolls/checkpoints from OSM"
          for i in 1 2 3; do git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
