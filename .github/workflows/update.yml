name: update-feed

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Gemini (temporary)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for m in gemini-3.8-flash gemini-flash-latest; do
            for cfg in '{}' '{"thinkingConfig":{"thinkingLevel":"low"}}' '{"thinkingConfig":{"thinkingBudget":0}}'; do
              echo "== $m $cfg"
              curl -sS -m 60 -o /tmp/r.json -w "HTTP %{http_code} in %{time_total}s\n" \
                "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" \
                -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
                -d "{\"contents\":[{\"parts\":[{\"text\":\"say ok\"}]}],\"generationConfig\":$cfg}" || true
              head -c 300 /tmp/r.json; echo
            done
          done
      - name: Collect new items
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/collect.py
      - name: Commit the feed
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data.json)" ]; then
            git add data.json
            git commit -m "Update feed"
            git fetch -q origin main
            if ! git merge -q -X ours --no-edit origin/main; then
              git checkout --ours data.json
              git add data.json
              git commit -q -m "Merge feed"
            fi
            git push
          fi

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
